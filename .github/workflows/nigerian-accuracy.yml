name: Nigerian accuracy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scorer
        run: python -m pip install -r eval/requirements.txt
      - name: Correction tests
        run: node --test tests/nigerian-corrections.test.mjs
      - name: Offline WER gate
        run: npm run eval:nigerian:gate
