<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/SFPRODISPLAYREGULAR.woff" as="font" type="font/woff" crossorigin />
    <link rel="preload" href="/fonts/SFPRODISPLAYMEDIUM.woff" as="font" type="font/woff" crossorigin />
    <link rel="preload" href="/fonts/SFPRODISPLAYBOLD.woff" as="font" type="font/woff" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="JotBox listens to meetings, seminars, and lectures, then writes the notes. Your scribe for the room and the call."
    />
    <meta name="theme-color" content="#f5f4ef" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="JotBox" />
    <title>JotBox — the notes are written while you listen</title>
    <script>
      try {
        var theme = localStorage.getItem("jotbox-theme");
        var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (theme === "dark" || (theme === "system" && systemDark)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
